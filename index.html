<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vibe ToDo 待办清单 ✨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <!-- 每日一签 区域 -->
    <div class="lottery-box">
      <div id="lotteryResult" class="lottery-result">
        今日还未抽签 🍀
      </div>
      <button id="drawBtn" class="draw-btn">点击抽签</button>
    </div>

    <button id="themeBtn">切换浅色模式</button>

    <h1>待办清单 ✨</h1>
    <div class="count-info">
      总计：<span id="total">0</span> 条 
      已完成：<span id="done">0</span> 条
    </div>

    <div class="input-box">
      <input type="text" id="todoInput" placeholder="输入新待办，回车添加..." />
      <button id="addBtn">添加</button>
    </div>

    <div class="filter-box">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="undone">未完成</button>
      <button class="filter-btn" data-filter="done">已完成</button>
    </div>

    <ul id="todoList"></ul>
    <button id="clearAll">清空所有待办</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
